name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::нет dist/index.html"; exit 1; }
          # Данные обязаны попасть в бандл: без них рулетка пустая.
          grep -rq "Джека-потрошителя" dist/assets/*.js || {
            echo "::error::темы не вшиты в сборку"; exit 1;
          }
          echo "Размер сборки: $(du -sh dist | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          # Токен Actions не может СОЗДАТЬ сайт Pages — на это нужны права
          # администратора. Поэтому на новом репозитории Pages включается один
          # раз руками или через API:
          #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
          # Флаг оставлен на случай, если права выданы: тогда он сработает сам.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
